name: daily-news

on:
  schedule:
    - cron: "0 23 * * *"   # 每天 UTC 23:00 = 台北時間早上 07:00
  workflow_dispatch:        # 也可以在 Actions 頁面手動按一次測試

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取新聞、產生分析與頁面
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python fetch_news.py
      - name: 提交更新
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add docs
          git commit -m "update $(date -u +%F)" || echo "沒有變更"
          git push
